<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Athlex - Iniciar Sesión</title>
    <!-- Hoja de estilos de Bootstrap (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Hoja de estilos propia del proyecto -->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Página de ingreso: primer contenido visible del sitio -->
    <main class="pagina-login">
        <div class="tarjeta-login">

            <div class="text-center mb-4">
                <p class="h3 fw-bold mb-1">🏃 Athlex</p>
                <p class="text-secondary mb-0">Tienda Deportiva · Inicia sesión</p>
            </div>

            <!-- Pestañas: Ingresar / Crear cuenta -->
            <ul class="nav nav-pills nav-fill gap-2 mb-4" id="tabsLogin" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="tab-ingresar" data-bs-toggle="pill"
                            data-bs-target="#panel-ingresar" type="button" role="tab"
                            aria-controls="panel-ingresar" aria-selected="true">Iniciar sesión</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="tab-crear" data-bs-toggle="pill"
                            data-bs-target="#panel-crear" type="button" role="tab"
                            aria-controls="panel-crear" aria-selected="false">Crear cuenta</button>
                </li>
            </ul>

            <div class="tab-content">

                <!-- Pestaña: Iniciar sesión -->
                <div class="tab-pane fade show active" id="panel-ingresar" role="tabpanel" aria-labelledby="tab-ingresar">

                    <!-- Alerta de credenciales incorrectas -->
                    <div class="alert alert-danger aviso-error d-none" id="avisoLogin" role="alert"></div>

                    <form id="formLogin" novalidate>

                        <div class="mb-3">
                            <label class="form-label" for="correoLogin">Correo electrónico</label>
                            <input type="email" class="form-control" id="correoLogin" name="correoLogin"
                                   placeholder="tucorreo@duoc.cl" maxlength="100">
                            <div class="error-msj" id="errorCorreoLogin"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="claveLogin">Contraseña</label>
                            <input type="password" class="form-control" id="claveLogin" name="claveLogin"
                                   placeholder="••••••" maxlength="10">
                            <div class="error-msj" id="errorClaveLogin"></div>
                        </div>

                        <button type="submit" class="btn btn-acento w-100">Ingresar</button>
                    </form>

                </div>

                <!-- Pestaña: Crear cuenta (cliente) -->
                <div class="tab-pane fade" id="panel-crear" role="tabpanel" aria-labelledby="tab-crear">

                    <form id="formRegistro" novalidate>

                        <div class="mb-3">
                            <label class="form-label" for="nombreRegistro">Nombre completo</label>
                            <input type="text" class="form-control" id="nombreRegistro" name="nombreRegistro"
                                   placeholder="Tu nombre y apellido" maxlength="100">
                            <div class="error-msj" id="errorNombreRegistro"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="correoRegistro">Correo electrónico</label>
                            <input type="email" class="form-control" id="correoRegistro" name="correoRegistro"
                                   placeholder="tucorreo@duoc.cl" maxlength="100">
                            <div class="error-msj" id="errorCorreoRegistro"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="claveRegistro">Contraseña</label>
                            <input type="password" class="form-control" id="claveRegistro" name="claveRegistro"
                                   placeholder="••••••" maxlength="10">
                            <div class="error-msj" id="errorClaveRegistro"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="claveConfirmarRegistro">Confirmar contraseña</label>
                            <input type="password" class="form-control" id="claveConfirmarRegistro" name="claveConfirmarRegistro"
                                   placeholder="••••••" maxlength="10">
                            <div class="error-msj" id="errorClaveConfirmarRegistro"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="direccionRegistro">Dirección</label>
                            <input type="text" class="form-control" id="direccionRegistro" name="direccionRegistro"
                                   placeholder="Calle, número, comuna" maxlength="200">
                            <div class="error-msj" id="errorDireccionRegistro"></div>
                        </div>

                        <button type="button" class="btn btn-acento w-100">Crear cuenta</button>
                        <p class="text-secondary small mt-2 mb-0 text-center">
                            Demostración visual: el registro no está habilitado en esta entrega.
                        </p>
                    </form>

                </div>

            </div>

            <!-- Cuentas de demostración -->
            <div class="aviso-login-rol mt-4">
                <p class="text-secondary mb-1 small text-center">Cuentas de demostración:</p>
                <div class="list-group list-group-flush small">
                    <div class="list-group-item d-flex justify-content-between">
                        <span>👤 Cliente</span>
                        <span><strong>cliente@duoc.cl</strong> / client1</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between">
                        <span>🛠 Administrador</span>
                        <span><strong>admin@duoc.cl</strong> / admin123</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts (Bootstrap + lógica del proyecto) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
