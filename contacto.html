<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto - Athlex</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Barra de navegación del cliente -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">🏃 Athlex</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuCliente" aria-controls="menuCliente" aria-expanded="false" aria-label="Desplegar menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuCliente">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item"><a class="nav-link" href="home.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><span class="nav-link text-secondary" id="usuarioNav"></span></li>
                    <li class="nav-item"><a class="nav-link link-sesion" href="#" id="salirSesion">Cerrar sesión</a></li>
                </ul>
                <a class="btn btn-acento ms-lg-3 d-inline-flex align-items-center gap-2" href="carrito.html">
                    🛒 Carrito
                </a>
            </div>
        </div>
    </nav>

    <!-- Formulario de contacto -->
    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <h1 class="h3 text-center mb-4">Contáctanos</h1>
                    <p class="text-secondary text-center mb-4">
                        ¿Dudas, sugerencias o pedidos especiales? Escríbenos y te responderemos a la brevedad.
                    </p>

                    <div class="card p-4">
                        <form id="formContacto" novalidate>

                            <div class="mb-3">
                                <label for="nombreContacto" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombreContacto" maxlength="100" placeholder="Tu nombre">
                                <div class="error-msj" id="errorNombreContacto"></div>
                            </div>

                            <div class="mb-3">
                                <label for="correoContacto" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="correoContacto" maxlength="100" placeholder="tucorreo@duoc.cl">
                                <div class="error-msj" id="errorCorreoContacto"></div>
                            </div>

                            <div class="mb-3">
                                <label for="comentarioContacto" class="form-label">Comentario</label>
                                <textarea class="form-control" id="comentarioContacto" rows="5" maxlength="500" placeholder="Cuéntanos en qué podemos ayudarte"></textarea>
                                <div class="d-flex justify-content-between">
                                    <div class="error-msj" id="errorComentarioContacto"></div>
                                    <small class="text-secondary" id="contadorComentario">0 / 500</small>
                                </div>
                            </div>

                            <div class="alert aviso-ok d-none" id="avisoContacto"></div>

                            <button type="submit" class="btn btn-acento w-100">Enviar mensaje</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="border-top py-4 mt-5">
        <div class="container">
            <div class="row text-center text-md-start align-items-center">
                <div class="col-md-4 mb-2 mb-md-0">
                    <p class="mb-0 text-secondary">© 2026 Athlex - Tienda Deportiva</p>
                </div>
                <div class="col-md-8 text-md-end">
                    <a href="productos.html" class="text-secondary me-3 text-decoration-none">Productos</a>
                    <a href="nosotros.html" class="text-secondary me-3 text-decoration-none">Nosotros</a>
                    <a href="carrito.html" class="text-secondary text-decoration-none">Carrito</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts (Bootstrap + lógica del proyecto) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/datos.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/contacto.js"></script>
    <script src="js/sesion.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            pintarSesion();
            var salir = document.getElementById("salirSesion");
            if (salir) {
                salir.addEventListener("click", function (e) {
                    e.preventDefault();
                    cerrarSesionCliente();
                });
            }
        });
    </script>

</body>
</html>
